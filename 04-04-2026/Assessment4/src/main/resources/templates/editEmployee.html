<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Employee</title>
    <style>
		body {
		    font-family: Arial, sans-serif;
		    background-color: #ffffff;
		    margin: 20px;
		    color: #222;
		}

		h2 {
		    margin-bottom: 15px;
		}

		.success-msg {
		    background-color: #f6f6f6;
		    color: #333;
		    padding: 8px 12px;
		    border: 1px solid #ddd;
		    margin-bottom: 15px;
		    display: inline-block;
		}

		table {
		    width: 100%;
		    border-collapse: collapse;
		}

		thead {
		    border-bottom: 2px solid #ccc;
		}

		th {
		    text-align: left;
		    padding: 10px;
		    font-weight: bold;
		}

		td {
		    padding: 10px;
		    border-bottom: 1px solid #eee;
		}

		tr:hover {
		    background-color: #f9f9f9;
		}

		a {
		    color: #000;
		    text-decoration: none;
		    font-size: 14px;
		}

		a:hover {
		    text-decoration: underline;
		}
    </style>
</head>
<body>

<div class="form-container">
    <form th:action="@{/edit}" th:object="${empDto}" method="post">

        <!-- Hidden field for ID -->
        <input type="hidden" th:field="*{empId}"/>

        <table>
            <tr>
                <td>ID</td>
                <td class="id-value" th:text="*{empId}"></td>
            </tr>
            <tr>
                <td>Name</td>
                <td>
                    <input type="text" th:field="*{empName}" placeholder="Employee Name"/>
                    <span class="error" th:if="${#fields.hasErrors('empName')}"
                          th:errors="*{empName}"></span>
                </td>
            </tr>
            <tr>
                <td>Salary</td>
                <td>
                    <input type="number" th:field="*{empSal}" step="0.01" placeholder="Salary"/>
                    <span class="error" th:if="${#fields.hasErrors('empSal')}"
                          th:errors="*{empSal}"></span>
                </td>
            </tr>
            <tr>
                <td>DOJ</td>
                <td>
                    <input type="date" th:field="*{empDoj}"/>
                    <span class="error" th:if="${#fields.hasErrors('empDoj')}"
                          th:errors="*{empDoj}"></span>
                </td>
            </tr>
            <tr>
                <td>Dept</td>
                <td>
                    <input type="text" th:field="*{deptName}" placeholder="hr or production"/>
                    <span class="error" th:if="${#fields.hasErrors('deptName')}"
                          th:errors="*{deptName}"></span>
                </td>
            </tr>
        </table>

        <button type="submit" class="btn-save">Save</button>

    </form>
</div>

</body>
</html>
